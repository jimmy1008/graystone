# 灰石村 12 戶（財產單位：金錢/糧食/柴火/工具掛在戶下）
# 金錢加總 = 2,700G（+村庫 300 = 全村 3,000，見 docs/05）
# 開局穀物 = 每人 150 份 × 戶內人數（全戶合計 4,500，另公共糧倉 2,100）
# 依據：春季開局距秋收 255 天，全村日耗 ~26 份（含釀酒/損耗），需 ~6,600 份

households:
  - id: h01
    name: 村長家
    members: [npc_01_1, npc_01_2, npc_01_3]
    head: npc_01_1
    money: 250
    residence: house_01
    stocks: {穀物: 450, 木柴: 10}
