# 開局庫存總帳（各戶明細在 households.yaml，本檔是全村彙總+推導依據）
# 起點：第 1 年 春季 第 1 天（離秋收入倉 ~255 天）

summary:
  穀物:
    各戶合計: 3600     # 每人 120 份 × 30 人
    公共糧倉: 1800
    全村合計: 5400
    推導: "全村日耗穀物 ≈20 份（28.8 食物需求 − 肉供給 ≈9）× 255 天至秋收 = 5,100；5,400 給 6% 緩衝＋糧倉應急"
  種糧:
    公共糧倉: 110      # 春播需 90（3 田 × 30）+ 20 備損
  木柴:
    各戶合計: 120      # 每戶 10 捆（春季用量小；冬前靠伐木補至 2,160+）
    鐵匠鋪: 30         # 鍛造燃料
  鐵礦:
    鐵匠鋪: 40
  鹽: {雜貨店: 20, 獵戶: 2}
  布: {雜貨店: 15}
  麥酒: {酒館: 40}
  鹽漬肉: {獵戶: 20}
  藥草: {草藥師: 10}

金錢:
  各戶合計: 2700
  村庫: 300
  全村合計: 3000       # 守恆不變量（docs/05）

工具: "13 件（11 鋤 2 鎬）+ 5 武器，明細見 items.yaml item_registry；耐久刻意參差，錯開更換週期"
