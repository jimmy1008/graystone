# Canon 種子 — 刻意留空（設計裁決 2026-08-09）
#
# ── 零預埋劇本原則（用戶裁決，優先級最高）──
# 世界開局不埋任何劇情線、暗線、秘密、恩怨、彩蛋。
# 所有故事必須由模擬運行中「各人物的關係、行為、話語」湧現：
#   - 恩怨：來自模擬中真實發生並落盤的糾紛/恩惠事件
#   - 秘密：來自 known_by 傳播的自然不均（有人在場、有人不在場）
#   - 誤會：來自 Phase 2 LLM 在「資訊不全」下寫入的 BELIEF（引擎保證它永不污染 FACT）
#   - 奇遇：走 docs/10 機緣系統（觸發時定奪，前因必須引用世界已有歷史，機緣池開局為空）
#
# 開局唯一的「歷史」是結構性人口事實（誰是誰的家人，見 households/npcs），
# 不附帶任何敘事解釋。第 1 天之前，這個世界沒有故事。

historical_characters: []   # 無預埋歷史人物
events: []                  # 無預埋歷史事件
beliefs: []                 # BELIEF 表開局為空（Phase 2 由 LLM 逐步寫入）
hidden_canon: []            # 機緣池開局為空（docs/10）
